<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard Caisse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container mt-4">

    <h3 class="mb-4">💵 Dashboard Caisse</h3>

    <!-- 📊 STATS -->
    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h6>💰 Total du jour</h6>
                <h4 class="text-success">{{ total_jour }} FCFA</h4>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h6>🧾 Commandes payées</h6>
                <h4>{{ nb_commandes }}</h4>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h6>⏳ En attente</h6>
                <h4 class="text-warning">{{ en_attente }}</h4>
            </div>
        </div>

    </div>

    <!-- 📋 LISTE COMMANDES -->
    <h5>🧾 Paiements Cash en attente</h5>

    <div id="commandes">

        {% for cmd in commandes %}
        <div class="card p-3 mb-3 shadow-sm">

            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <strong>#{{ cmd.id }}</strong><br>
                    {{ cmd.total }} FCFA
                </div>

                <button class="btn btn-success"
                        onclick="valider({{ cmd.id }})">
                    ✅ Valider
                </button>

            </div>

        </div>
        {% empty %}
        <p>Aucune commande en attente</p>
        {% endfor %}

    </div>

</div>

<script>
function valider(id){

    fetch(`/caisse/valider/${id}/`)
    .then(res => res.json())
    .then(data=>{
        if(data.success){
            location.reload();
        }
    });

}

// 🔥 AUTO REFRESH (toutes les 5 secondes)
setInterval(()=>{
    location.reload();
}, 5000);
</script>

</body>
</html>

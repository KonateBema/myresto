{% load humanize %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Récapitulatif commande | {{ home_data.site_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <h3 class="mb-4">Récapitulatif de votre commande</h3>

        <!-- =================== RÉCAP PANIER =================== -->
        <div class="card mb-4">
            <div class="card-body" id="recap-cart"></div>
            <h5 class="text-end me-4">Total :
                <span id="total-price">0</span> FCFA
            </h5>
        </div>

        <!-- =================== FORMULAIRE =================== -->
        <form method="POST" id="checkout-form">
            {% csrf_token %}
            <input type="hidden" name="cart_items" id="cart_items">

            <div class="card">
                <div class="card-body">

                    <div class="mb-3">
                        <label>Nom complet</label>
                        <input type="text" name="customer_name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="customer_email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Téléphone</label>
                        <input type="text" name="customer_phone" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Adresse de livraison</label>
                        <textarea name="customer_address" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label>Moyen de paiement</label>
                        <select name="payment" class="form-select" required>
                            <option value="cash">Paiement à la livraison</option>
                            <option value="mobile_money">Mobile Money</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-2">
                        ✅ Valider la commande
                    </button>

                </div>
            </div>
        </form>

    </div>

    <script>
        // Récupération du panier stocké côté frontend
        const cart = JSON.parse(localStorage.getItem("checkout_cart")) || [];
        const recap = document.getElementById("recap-cart");
        const totalSpan = document.getElementById("total-price");
        const cartInput = document.getElementById("cart_items");

        if (cart.length === 0) {
            recap.innerHTML = "<p>Votre panier est vide.</p>";
            totalSpan.innerText = "0";
        } else {
            let total = 0;
            recap.innerHTML = "";
            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                recap.innerHTML += `
                    <p>
                        <strong>${item.name}</strong>
                        × ${item.qty}
                        = ${subtotal.toLocaleString()} FCFA
                    </p>
                `;
            });

            totalSpan.innerText = total.toLocaleString();
            cartInput.value = JSON.stringify(cart);
        }

        // Optionnel : empêcher l'envoi si le panier est vide
        document.getElementById("checkout-form").addEventListener("submit", function(e) {
            if (cart.length === 0) {
                e.preventDefault();
                alert("Votre panier est vide !");
            }
        });
    </script>

</body>

</html>

<h2>🧾 Audit de caisse</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Caissier</th>
            <th>Action</th>
            <th>Commande</th>
            <th>Avant</th>
            <th>Après</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.cashier }}</td>
            <td>
                <span class="badge bg-info">
                    {{ log.action }}
                </span>
            </td>
            <td>#{{ log.commande_id }}</td>
            <td>{{ log.amount_before }} FCFA</td>
            <td>{{ log.amount_after }} FCFA</td>
            <td>{{ log.created_at|date:"d/m/Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6" class="text-center">
                Aucun audit disponible
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

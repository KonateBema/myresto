<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement Wave</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f5f7fb;
    font-family: 'Segoe UI';
}

.wave-card {
    max-width: 500px;
    margin: auto;
    margin-top: 60px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
}

.copy-btn {
    cursor: pointer;
}
</style>

</head>

<body>

<div class="wave-card">

    <h4>🌊 Paiement Wave</h4>

    <p class="mt-3">Envoyez :</p>
    <h3 class="text-primary">{{ commande.total }} FCFA</h3>

    <p>au numéro :</p>
    <h4 id="waveNumber">{{ wave_number }}</h4>

    <button onclick="copyNumber()" class="btn btn-outline-primary btn-sm mb-3">
        📋 Copier le numéro
    </button>

    <p class="text-muted">
        Référence : <strong>#{{ commande.id }}</strong>
    </p>

    <hr>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label class="form-label">📸 Preuve de paiement</label>
        <input type="file" name="payment_proof" class="form-control" required>

        <button class="btn btn-success w-100 mt-3">
            ✅ Envoyer la preuve
        </button>
    </form>

</div>

<script>
function copyNumber() {
    const number = document.getElementById("waveNumber").innerText;
    navigator.clipboard.writeText(number);
    alert("Numéro copié !");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement sécurisé</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }

.payment-card {
    max-width: 500px;
    margin: 60px auto;
    padding: 30px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.payment-option {
    border: 2px solid #eee;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
}

.payment-option.active {
    border-color: #0d6efd;
    background: #e7f1ff;
}

.operator-tabs {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border: 1px dashed #0d6efd;
    border-radius: 10px;
    justify-content: space-around;
}

.operator-tabs button {
    flex: 1;
    margin: 5px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="payment-card">
    <h4 class="text-center mb-3">💳 Paiement sécurisé</h4>
    <p class="text-center">Montant : <strong>{{ commande.total }} FCFA</strong></p>

    <!-- Choix paiement -->
    <form id="payment-form">

        <label class="payment-option">
            <input type="radio" name="payment_method" value="mobile_money">
            📱 Mobile Money
        </label>

        <div class="operator-tabs" id="mobile-tabs">
            <button type="button" data-operator="MTN">MTN</button>
            <button type="button" data-operator="Orange">Orange</button>
            <button type="button" data-operator="Moov">Moov</button>
        </div>

        <label class="payment-option">
            <input type="radio" name="payment_method" value="wave">
            🌊 Wave
        </label>

        <label class="payment-option">
            <input type="radio" name="payment_method" value="cash">
            💵 Cash
        </label>

    </form>

    <!-- Numéro -->
    <div id="phone-input" style="display:none; margin-top:10px;">
        <input type="text" id="phone" class="form-control" placeholder="Ex: 0700000000">
        <button id="pay-btn" class="btn btn-success w-100 mt-2">
            Payer maintenant
        </button>
    </div>

    <!-- Bouton Wave / Cash -->
    <button id="submit-btn" class="btn btn-primary w-100 mt-3">
        Continuer
    </button>
</div>

<!-- Modal -->
<div class="modal fade" id="paymentModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <h5>📱 Paiement en cours</h5>
      <p id="modal-text">Validez sur votre téléphone...</p>
      <div class="spinner-border text-primary"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// ================== VARIABLES ==================
let selectedOperator = null;
let currentTransactionId = null;

const modal = new bootstrap.Modal(document.getElementById('paymentModal'));
const phoneInput = document.getElementById("phone-input");
const mobileTabs = document.getElementById("mobile-tabs");

// ================== CSRF ==================
function getCSRFToken() {
    return document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
}

// ================== CHOIX MODE ==================
document.querySelectorAll('input[name="payment_method"]').forEach(input => {
    input.addEventListener('change', () => {

        document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
        input.closest('.payment-option').classList.add('active');

        if(input.value === "mobile_money"){
            mobileTabs.style.display = "flex";
        } else {
            mobileTabs.style.display = "none";
            phoneInput.style.display = "none";
        }
    });
});

// ================== CHOIX OPERATEUR ==================
document.querySelectorAll('.operator-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
        selectedOperator = btn.dataset.operator;
        phoneInput.style.display = "block";
    });
});

// ================== PAIEMENT MOBILE MONEY ==================
document.getElementById("pay-btn").addEventListener("click", () => {

    const phone = document.getElementById("phone").value;

    if(!phone){
        alert("Entrez votre numéro");
        return;
    }

    modal.show();

    fetch(`/payment/process_mobile_money/{{ commande.id }}/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify({
            operator: selectedOperator,
            phone: phone
        })
    })
    .then(res => res.json())
    .then(data => {

        if(data.trans_id){
            currentTransactionId = data.trans_id;
            checkPaymentStatus();
        } else {
            document.getElementById("modal-text").innerText = "Erreur paiement";
        }

    })
    .catch(() => {
        document.getElementById("modal-text").innerText = "Erreur réseau";
    });

});

// ================== CHECK STATUS ==================
function checkPaymentStatus(){

    let interval = setInterval(() => {

        fetch(`/payment/check_status/${currentTransactionId}/`)
        .then(res => res.json())
        .then(data => {

            if(data.status === "ACCEPTED"){
                clearInterval(interval);

                document.getElementById("modal-text").innerText = "✅ Paiement réussi";

                setTimeout(() => {
                    window.location.href = `/payment/success/{{ commande.id }}/`;
                }, 2000);
            }

            if(data.status === "REFUSED"){
                clearInterval(interval);
                document.getElementById("modal-text").innerText = "❌ Paiement refusé";
            }

        });

    }, 3000);

}

// ================== WAVE / CASH ==================
document.getElementById("submit-btn").addEventListener("click", () => {

    const selected = document.querySelector('input[name="payment_method"]:checked');

    if(!selected){
        alert("Choisissez un mode de paiement");
        return;
    }

    if(selected.value === "cash"){
        window.location.href = `/payment/success/{{ commande.id }}/?method=cash`;
    }

    if(selected.value === "wave"){
        fetch(`/payment/process_wave_payment/{{ commande.id }}/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            }
        })
        .then(res => res.json())
        .then(data => {
            if(data.payment_url){
                window.location.href = data.payment_url;
            } else {
                alert("Erreur Wave");
            }
        });
    }

});

</script>

</body>
</html>

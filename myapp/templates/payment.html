<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #eef2f7, #f8f9fa);
    font-family: 'Segoe UI', sans-serif;
}

.payment-card {
    max-width: 500px;
    margin: auto;
    margin-top: 60px;
    padding: 30px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.payment-option {
    border: 2px solid #eee;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.payment-option:hover {
    border-color: #0d6efd;
    transform: scale(1.01);
}

.payment-option input {
    transform: scale(1.2);
}

/* ACTIVE */
.payment-option.active {
    border-color: #0d6efd;
    background-color: #e7f1ff;
}

.btn-pay {
    background: linear-gradient(135deg, #0d6efd, #0b5ed7);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
}

/* Section spécifique pour paiement Mobile Money */
#mobile-money-info,
#wave-info {
    display: none;
    margin-top: 15px;
    padding: 10px;
    border: 1px dashed #0d6efd;
    border-radius: 10px;
    background-color: #f0f8ff;
}
</style>

</head>

<body>

<div class="payment-card">

    <h4 class="mb-3 text-center">💳 Paiement sécurisé</h4>

    <p class="text-center">
        Montant à payer :
        <strong class="text-primary">{{ commande.total }} FCFA</strong>
    </p>

    <form method="POST" id="payment-form">
        {% csrf_token %}

        <!-- Mobile Money -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="mobile_money" required>
            📱 Mobile Money (MTN / Orange / Moov)
        </label>
        <div id="mobile-money-info">
            <p>Suivez les instructions sur votre téléphone pour payer via Mobile Money.</p>
        </div>

        <!-- Wave -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="wave">
            🌊 Wave (paiement direct)
        </label>
        <div id="wave-info">
            <p>Un agent Wave vous contactera pour finaliser le paiement.</p>
        </div>

        <!-- Cash -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="cash">
            💵 Paiement à la livraison
        </label>

        <button class="btn btn-pay w-100 mt-3">
            🚀 Continuer
        </button>

    </form>

</div>

<script>
// Gestion de l'UI pour l'option sélectionnée
document.querySelectorAll('.payment-option input').forEach(input => {
    input.addEventListener('change', function() {
        // Retirer active de toutes
        document.querySelectorAll('.payment-option').forEach(label => label.classList.remove('active'));
        this.closest('.payment-option').classList.add('active');

        // Masquer toutes les sections d'info
        document.getElementById('mobile-money-info').style.display = 'none';
        document.getElementById('wave-info').style.display = 'none';

        // Afficher celle correspondant à la sélection
        if(this.value === 'mobile_money') {
            document.getElementById('mobile-money-info').style.display = 'block';
        } else if(this.value === 'wave') {
            document.getElementById('wave-info').style.display = 'block';
        }
    });
});

// Optionnel : validation avant submit
document.getElementById('payment-form').addEventListener('submit', function(e){
    const selected = document.querySelector('input[name="payment_method"]:checked');
    if(!selected){
        alert("Veuillez choisir un moyen de paiement !");
        e.preventDefault();
    }
});
</script>

</body>
</html>

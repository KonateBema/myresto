<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement sécurisé</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
.payment-card { max-width: 500px; margin: 60px auto; padding: 30px; border-radius: 20px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.payment-option { border: 2px solid #eee; border-radius: 12px; padding: 15px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; }
.payment-option.active { border-color: #0d6efd; background: #e7f1ff; }
.payment-option input { margin-right: 10px; }
.operator-tabs { display: none; margin-top: 10px; padding: 10px; border: 1px dashed #0d6efd; border-radius: 10px; justify-content: space-around; }
.operator-tabs button { flex: 1; margin: 5px; background: #0d6efd; color: white; border: none; border-radius: 10px; padding: 10px; cursor: pointer; }
.operator-tabs button:hover { background: #084298; }
</style>
</head>
<body>

<div class="payment-card">
    <h4 class="text-center mb-3">💳 Paiement sécurisé</h4>
    <p class="text-center">Montant : <strong>{{ commande.total }} FCFA</strong></p>

    <form id="payment-form" method="POST">{% csrf_token %}
        <!-- Mobile Money -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="mobile_money">
            📱 Mobile Money
        </label>
        <div class="operator-tabs" id="mobile-tabs">
            <button type="button" data-operator="MTN">MTN</button>
            <button type="button" data-operator="Orange">Orange</button>
            <button type="button" data-operator="Moov">Moov</button>
        </div>

        <!-- Wave -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="wave">
            🌊 Wave
        </label>

        <!-- Cash -->
        <label class="payment-option">
            <input type="radio" name="payment_method" value="cash">
            💵 Cash
        </label>

        <button class="btn btn-primary w-100 mt-3" type="submit">Continuer</button>
    </form>
</div>

<script>
// 🔹 Gestion affichage opérateurs Mobile Money
const options = document.querySelectorAll('input[name="payment_method"]');
const mobileTabs = document.getElementById('mobile-tabs');

options.forEach(input => {
    input.addEventListener('change', () => {
        document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
        input.closest('.payment-option').classList.add('active');

        mobileTabs.style.display = input.value === "mobile_money" ? "flex" : "none";
    });
});

// 🔹 CSRF token depuis cookie
function getCSRFToken() {
    return document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
}

// 🔹 Clic sur opérateur Mobile Money
document.querySelectorAll('.operator-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
        const operator = btn.dataset.operator;
        fetch(`/payment/process_mobile_money/{{ commande.id }}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
            body: JSON.stringify({ operator })
        })
        .then(res => res.json())
        .then(data => {
            if(data.payment_url) window.location.href = data.payment_url;
            else alert("Erreur paiement : " + JSON.stringify(data));
        })
        .catch(err => alert("Erreur réseau : " + err));
    });
});

// 🔹 Soumission formulaire Wave / Cash
document.getElementById("payment-form").addEventListener("submit", function(e){
    e.preventDefault();
    const selected = document.querySelector('input[name="payment_method"]:checked');
    if(!selected){ alert("Veuillez choisir un moyen de paiement"); return; }

    const method = selected.value;
    if(method === "cash"){
        window.location.href = `/payment/success/{{ commande.id }}/?method=cash`;
    } else if(method === "wave"){
        fetch(`/payment/process_wave_payment/{{ commande.id }}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
            body: JSON.stringify({})
        })
        .then(res => res.json())
        .then(data => {
            if(data.payment_url) window.location.href = data.payment_url;
            else alert("Erreur paiement Wave : " + JSON.stringify(data));
        })
        .catch(err => alert("Erreur réseau : " + err));
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Paiement sécurisé</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .payment-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 20px;
            background: #fff;
        }

        .payment-option {
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .payment-option.active {
            border-color: #0d6efd;
            background: #eef5ff;
        }

        .operator-tabs {
            display: none;
            margin-top: 10px;
        }

        .operator-tabs button {
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="payment-card">

        <h4 class="text-center">💳 Paiement sécurisé</h4>
        <p class="text-center">Montant : <strong>{{ commande.total }} FCFA</strong></p>

        <form id="payment-form">

            <!-- <label class="payment-option">
                <input type="radio" name="method" value="mobile">
                📱 Mobile Money
            </label>

            <div class="operator-tabs" id="operators">
                <button type="button" data-op="MTN">MTN</button>
                <button type="button" data-op="ORANGE">Orange</button>
                <button type="button" data-op="MOOV">Moov</button>
            </div> -->

            <label class="payment-option">
                <input type="radio" name="method" value="wave">
                🌊 Wave
            </label>

            <label class="payment-option">
                <input type="radio" name="method" value="cash">
                💵 Cash
            </label>

        </form>

        <div id="phone-box" style="display:none;">
            <input type="text" id="phone" class="form-control mt-2" placeholder="0700000000">
            <button class="btn btn-success w-100 mt-2" id="pay-mobile">
                Payer maintenant
            </button>
        </div>

        <button class="btn btn-primary w-100 mt-3" id="continue">
            Continuer
        </button>

    </div>

    <script>

        // VARIABLES
        let operator = null;

        // CSRF
        function getCSRF() {
            return document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
        }

        // SELECT MODE
        document.querySelectorAll('input[name="method"]').forEach(input => {
            input.addEventListener('change', () => {

                document.querySelectorAll('.payment-option')
                    .forEach(el => el.classList.remove('active'));

                input.closest('.payment-option').classList.add('active');

                if (input.value === "mobile") {
                    document.getElementById("operators").style.display = "block";
                } else {
                    document.getElementById("operators").style.display = "none";
                    document.getElementById("phone-box").style.display = "none";
                }
            });
        });

        // SELECT OPERATOR
        document.querySelectorAll('#operators button').forEach(btn => {
            btn.addEventListener('click', () => {
                operator = btn.dataset.op;
                document.getElementById("phone-box").style.display = "block";
            });
        });

        // MOBILE MONEY
        document.getElementById("pay-mobile").onclick = () => {

            const phone = document.getElementById("phone").value;

            if (!phone) {
                alert("Numéro requis");
                return;
            }

            fetch(`/payment/process_mobile_money/{{ commande.id }}/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRF()
                },
                body: JSON.stringify({
                    operator: operator,
                    phone: phone
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.trans_id) {
                        alert("Paiement lancé, validez sur votre téléphone");
                    } else {
                        alert("Erreur paiement");
                    }
                });
        };

        // CONTINUE BUTTON
        // document.getElementById("continue").onclick = ()=>{

        //     const selected = document.querySelector('input[name="method"]:checked');

        //     if(!selected){
        //         alert("Choisissez un mode");
        //         return;
        //     }

        //     // CASH
        //     if(selected.value === "cash"){
        //         window.location.href = `/payment/success/{{ commande.id }}/?method=cash`;
        //     }

        //     // WAVE (LIEN DIRECT)
        //     if(selected.value === "wave"){

        //         const amount = {{ commande.total }};

        //         const waveUrl = `https://pay.wave.com/m/M_ci_r3vEPsG6pQsB/c/ci/?amount=${amount}`;

        //         window.location.href = waveUrl;
        //     }
        // };

        document.getElementById("continue").onclick = () => {

            const selected = document.querySelector('input[name="method"]:checked');

            if (!selected) {
                alert("Choisissez un mode");
                return;
            }

            if (selected.value === "wave") {

                fetch(`/payment/wave/{{ commande.id }}/`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.url) {
                            window.location.href = data.url;
                        }
                    });
            }
            // if (selected.value === "cash") {
            //     window.location.href = `/payment/success/{{ commande.id }}/?method=cash`;
            // }
            if (selected.value === "cash") {
                window.location.href = `/payment/cash/{{ commande.id }}/`;
            }
        };


    </script>

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panier | {{ home_data.site_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f5f5; }
    .cart-container { background: #fff; border-radius: 8px; padding: 20px; }
    .cart-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .cart-item:last-child { border-bottom: none; }
    .btn-remove { font-size: 14px; }
    .total-box { font-size: 20px; font-weight: bold; color: #f68b1e; }
    .qty-input { width: 60px; }
  </style>
</head>

<body>
<div class="container py-4">
  <h2 class="mb-4">🛒 Votre panier</h2>

  <div id="cart" class="cart-container">
    <!-- Les produits seront injectés ici par JS -->
  </div>

  <div class="mt-3 text-end">
    <div class="total-box mb-2">Total : <span id="cart-total">0</span> FCFA</div>
    <button id="checkout-btn" class="btn btn-success">Passer la commande</button>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary">⬅ Continuer vos achats</a>
  </div>
</div>

<script>
  // Fonction pour afficher le panier
  function renderCart() {
    const cartContainer = document.getElementById('cart');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cartContainer.innerHTML = '';

    if(cart.length === 0){
      cartContainer.innerHTML = '<p>Votre panier est vide.</p>';
      document.getElementById('cart-total').innerText = '0';
      return;
    }

    let total = 0;

    cart.forEach((item, index) => {
      const subtotal = item.price * item.qty;
      total += subtotal;

      const div = document.createElement('div');
      div.classList.add('cart-item', 'd-flex', 'align-items-center', 'justify-content-between');

      div.innerHTML = `
        <div>
          <h6>${item.name}</h6>
          <small>${item.price} FCFA / unité</small>
        </div>
        <div class="d-flex align-items-center">
          <input type="number" min="1" value="${item.qty}" class="form-control form-control-sm qty-input me-2" data-index="${index}">
          <span class="me-3">${subtotal} FCFA</span>
          <button class="btn btn-sm btn-danger btn-remove" data-index="${index}">Supprimer</button>
        </div>
      `;
      cartContainer.appendChild(div);
    });

    document.getElementById('cart-total').innerText = total;
  }

  // Initial render
  renderCart();

  // Gestion des changements de quantité
  document.getElementById('cart').addEventListener('change', function(e){
    if(e.target.classList.contains('qty-input')){
      const index = e.target.getAttribute('data-index');
      const newQty = parseInt(e.target.value);
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart[index].qty = newQty;
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }
  });

  // Supprimer un produit
  document.getElementById('cart').addEventListener('click', function(e){
    if(e.target.classList.contains('btn-remove')){
      const index = e.target.getAttribute('data-index');
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }
  });

  // Bouton passer commande
  document.getElementById('checkout-btn').addEventListener('click', function(){
    alert('Commande passée ! (Pour le moment, redirection ou envoi au serveur à implémenter)');
    localStorage.removeItem('cart');
    renderCart();
  });

  document.getElementById('checkout-btn').addEventListener('click', async function(){
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if(cart.length === 0){
    alert('Votre panier est vide !');
    return;
  }

  try {
    const response = await fetch("{% url 'checkout' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({ cart: cart })
    });

    const data = await response.json();
    if(response.ok){
      alert(data.message);
      localStorage.removeItem('cart');
      window.location.href = "{% url 'home' %}";
    } else {
      alert(data.error || 'Erreur lors de la commande.');
    }
  } catch(err) {
    console.error(err);
    alert('Erreur réseau, réessayez.');
  }
});
</script>

</body>
</html>
